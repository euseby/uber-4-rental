# Setarile de conectare la PostgreSQL-ul din Docker sau din Supabase (daca exista Variabile de Mediu)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/uber-db}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:test}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Config
jwt.secret=AceastaEsteOCheieSecretaFoarteLungaSiSiguraPentruUber4Rental2024!

# Email Config (Replace with real credentials for Production)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true